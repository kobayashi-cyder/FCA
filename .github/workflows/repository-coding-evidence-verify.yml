name: FCA repository coding evidence verify

on:
  push:
    branches:
      - feature/repository-coding-evidence-import
    paths:
      - "fca/repository_exchange.py"
      - "fca/exchange.py"
      - "fca/exchange_registry.py"
      - "fca/__init__.py"
      - "tests/test_repository_exchange.py"
      - ".github/workflows/repository-coding-evidence-verify.yml"
  pull_request:
    paths:
      - "fca/repository_exchange.py"
      - "fca/exchange.py"
      - "fca/exchange_registry.py"
      - "fca/__init__.py"
      - "tests/test_repository_exchange.py"
      - ".github/workflows/repository-coding-evidence-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Compile FCA exchange modules
        run: |
          python -m compileall -q fca
      - name: Run exchange regression
        run: |
          python -m unittest discover -s tests -p "test_exchange*.py" -v
          python -m unittest discover -s tests -p "test_repository_exchange.py" -v
